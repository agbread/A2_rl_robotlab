policy_path: "{ROOT_DIR}/logs/rsl_rl/a2_moe_cts/2026-09-04_09-44-01/exported/policy.pt" # policy.pt exported by running scripts/rsl_rl/play.py

xml_path: "{ROOT_DIR}/resources/a2_description/stairs.xml" # or flat.xml

render_fps: 60
video_fps: 60
save_video: false

# Total simulation time
simulation_duration: 60000000.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10
base_init_pos: [0.0, 0.0, 0.45]
base_init_quat: [1.0, 0.0, 0.0, 0.0]

# Based on IsaacLab's DelayedPDActuatorCfg (A2_CFG: min_delay=0, max_delay=4 physics steps of 5 ms).
# Sampled once per actuator group (hip+thigh, calf) at start, in milliseconds.
actuator_delay_ms_min: 0.0
actuator_delay_ms_max: 20.0
actuator_delay_seed: 0

# Joint order below follows model_joint_names (FL, FR, RL, RR).
# PD gains from A2_CFG (robot_lab/assets/unitree.py).
kps: [100.0, 100.0, 150.0, 100.0, 100.0, 150.0, 100.0, 100.0, 150.0, 100.0, 100.0, 150.0]
kds: [4.0, 4.0, 6.0, 4.0, 4.0, 6.0, 4.0, 4.0, 6.0, 4.0, 4.0, 6.0]

# UnitreeActuator torque-speed curve: |tau| <= torque_limit below knee_velocity,
# then decreases linearly to 0 at no_load_velocity.
torque_limit: [120.0, 120.0, 180.0, 120.0, 120.0, 180.0, 120.0, 120.0, 180.0, 120.0, 120.0, 180.0]
knee_velocity: [20.0, 20.0, 13.0, 20.0, 20.0, 13.0, 20.0, 20.0, 13.0, 20.0, 20.0, 13.0]
no_load_velocity: [22.0, 22.0, 14.6667, 22.0, 22.0, 14.6667, 22.0, 22.0, 14.6667, 22.0, 22.0, 14.6667]

# MJCF joints have damping/frictionloss that IsaacLab training does not model; true removes them.
zero_joint_friction: false

# NOTE: hip signs are opposite to Go2 (R=+0.1, L=-0.1)
default_angles: [-0.1, 0.9, -1.8, 0.1, 0.9, -1.8,
                 -0.1, 0.9, -1.8, 0.1, 0.9, -1.8]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_pos_scale: 0.25
cmd_scale: [1.0, 1.0, 1.0]
num_actions: 12
num_obs: 45
max_cmd: [1.5, 1.0, 1.5]

cmd_init: [0.5, 0.0, 0.0]
history_len: 10

# Policy (IsaacLab) joint order. MuJoCo qpos and actuator orders differ in a2.xml,
# so deploy_a2.py maps both by joint name.
model_joint_names: [
  "FL_hip_joint",
  "FL_thigh_joint",
  "FL_calf_joint",
  "FR_hip_joint",
  "FR_thigh_joint",
  "FR_calf_joint",
  "RL_hip_joint",
  "RL_thigh_joint",
  "RL_calf_joint",
  "RR_hip_joint",
  "RR_thigh_joint",
  "RR_calf_joint",
]
